<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - Shaik Reza Shafiq</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.js"></script>
    <style>
        /* Replicates Google Docs standard page styling */
        body { font-family: "Arial", sans-serif; line-height: 1.5; color: #333333; max-width: 816px; margin: 60px auto; padding: 0 96px; background-color: #ffffff; }
        .toolbar { max-width: 816px; margin: -30px auto 30px auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: sans-serif; }
        .toolbar-actions { display: flex; gap: 8px; }
        .action-btn { background: #10b981; color: white; padding: 10px 18px; text-decoration: none; border-radius: 4px; font-weight: bold; border: none; font-size: 14px; font-family: inherit; cursor: pointer; }
        .action-btn.docx { background: #2563eb; }
        .action-btn:disabled { background: #94a3b8; cursor: not-allowed; }
        #status { max-width: 816px; margin: 0 auto 16px auto; font-family: sans-serif; font-size: 13px; padding: 10px 12px; border-radius: 4px; display: none; }
        #status.err { display: block; background: #fef2f2; border-left: 4px solid #ef4444; color: #991b1b; }
        #status.ok { display: block; background: #f0fdf4; border-left: 4px solid #22c55e; color: #166534; }

        h1 { font-size: 26px; text-align: center; margin-bottom: 5px; text-transform: uppercase; }
        h2 { font-size: 16px; border-bottom: 1px solid #333333; padding-bottom: 3px; margin-top: 25px; text-transform: uppercase; }
        h3 { font-size: 14px; margin-top: 20px; margin-bottom: 2px; }
        h4 { font-size: 13px; margin-top: 16px; margin-bottom: 4px; font-style: italic; color: #444444; }
        p, li { font-size: 13px; }
        li { margin-bottom: 6px; }
        a { color: #1155cc; }
        hr { border: none; border-top: 1px solid #cccccc; margin: 16px 0; }

        @media print {
            .toolbar, #status { display: none !important; }
            body { margin: 0; padding: 0; max-width: none; }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <a href="../index.html" style="color: #666; text-decoration: none;">← Back Home</a>
        <div class="toolbar-actions">
            <button id="docx-btn" class="action-btn docx" disabled>⬇️ Download as DOCX</button>
            <a href="matcher.html" class="action-btn">🤖 Scan CV with AI Matcher</a>
        </div>
    </div>
    <div id="status"></div>
    <div id="google-doc-sheet">Loading resume details...</div>

    <script>
    (function () {
        const RESUME_URL = '../content/Shaik_Reza_Shafiq_Resume.md';
        const FILENAME = 'Shaik_Reza_Shafiq_Resume.docx';
        const sheet = document.getElementById('google-doc-sheet');
        const statusBox = document.getElementById('status');
        const docxBtn = document.getElementById('docx-btn');
        let markdownSource = '';

        function setStatus(msg, kind) {
            statusBox.textContent = msg;
            statusBox.className = kind || '';
        }

        // ---------- Load + render ----------
        fetch(RESUME_URL)
            .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.text(); })
            .then(md => {
                markdownSource = md;
                sheet.innerHTML = marked.parse(md);
                if (window.docx) {
                    docxBtn.disabled = false;
                } else {
                    setStatus('Resume loaded, but the DOCX library failed to load from the CDN — download is unavailable. Check your network or ad-blocker.', 'err');
                }
            })
            .catch(err => {
                const isFileProtocol = location.protocol === 'file:';
                sheet.textContent = 'Failed to load resume: ' + err;
                setStatus(
                    isFileProtocol
                        ? 'This page is open via file:// — browsers block reading local files from script for security. Serve the folder over HTTP (any static server, or GitHub Pages) and it will work.'
                        : 'Could not fetch ' + RESUME_URL + ' (' + err + ').',
                    'err'
                );
            });

        // ---------- Markdown -> DOCX ----------
        // Single column, no tables, no text boxes, no header/footer content:
        // deliberately ATS-parser friendly rather than visually decorative.
        function buildDocx(markdown) {
            const {
                Document, Packer, Paragraph, TextRun, ExternalHyperlink,
                AlignmentType, BorderStyle
            } = window.docx;

            function inlineRuns(tokens, fmt) {
                fmt = fmt || {};
                const out = [];
                (tokens || []).forEach(function (t) {
                    switch (t.type) {
                        case 'strong':
                            out.push.apply(out, inlineRuns(t.tokens, Object.assign({}, fmt, { bold: true })));
                            break;
                        case 'em':
                            out.push.apply(out, inlineRuns(t.tokens, Object.assign({}, fmt, { italics: true })));
                            break;
                        case 'del':
                            out.push.apply(out, inlineRuns(t.tokens, Object.assign({}, fmt, { strike: true })));
                            break;
                        case 'codespan':
                            out.push(new TextRun(Object.assign({}, fmt, { text: t.text, font: 'Consolas' })));
                            break;
                        case 'br':
                            out.push(new TextRun(Object.assign({}, fmt, { text: '', break: 1 })));
                            break;
                        case 'link': {
                            const kids = inlineRuns(t.tokens, Object.assign({}, fmt, { style: 'Hyperlink' }));
                            out.push(new ExternalHyperlink({
                                children: kids.length ? kids : [new TextRun({ text: t.text || t.href })],
                                link: t.href
                            }));
                            break;
                        }
                        default:
                            if (t.tokens && t.tokens.length) {
                                out.push.apply(out, inlineRuns(t.tokens, fmt));
                            } else {
                                const txt = (t.text !== undefined ? t.text : t.raw) || '';
                                if (txt) out.push(new TextRun(Object.assign({}, fmt, { text: txt })));
                            }
                    }
                });
                return out;
            }

            const HEADING_SPEC = {
                1: { size: 32, bold: true, caps: true, alignment: AlignmentType.CENTER, before: 0,   after: 60 },
                2: { size: 24, bold: true, caps: true, border: true,                    before: 280, after: 100 },
                3: { size: 22, bold: true,                                              before: 220, after: 40 },
                4: { size: 21, bold: true, italics: true,                               before: 160, after: 40 }
            };

            function headingParagraph(tok) {
                const spec = HEADING_SPEC[tok.depth] || HEADING_SPEC[4];
                let runs = inlineRuns(tok.tokens, {
                    bold: spec.bold, italics: spec.italics, size: spec.size, allCaps: spec.caps
                });
                if (!runs.length) runs = [new TextRun({ text: tok.text, bold: true, size: spec.size })];
                const opts = {
                    children: runs,
                    spacing: { before: spec.before, after: spec.after },
                    keepNext: true
                };
                if (spec.alignment) opts.alignment = spec.alignment;
                if (spec.border) {
                    opts.border = { bottom: { style: BorderStyle.SINGLE, size: 6, color: '333333', space: 2 } };
                }
                return new Paragraph(opts);
            }

            function listItemParagraphs(item) {
                // A list item's children may be `text` blocks (with inline tokens) or nested paragraphs.
                const runs = [];
                (item.tokens || []).forEach(function (child) {
                    if (child.type === 'text' || child.type === 'paragraph') {
                        runs.push.apply(runs, inlineRuns(child.tokens || [], { size: 20 }));
                    } else if (child.type === 'list') {
                        // nested lists are flattened one level deeper below
                    }
                });
                const paras = [];
                if (runs.length) {
                    paras.push(new Paragraph({
                        children: runs,
                        bullet: { level: 0 },
                        spacing: { after: 80 }
                    }));
                }
                (item.tokens || []).forEach(function (child) {
                    if (child.type === 'list') {
                        (child.items || []).forEach(function (sub) {
                            const subRuns = [];
                            (sub.tokens || []).forEach(function (c) {
                                if (c.type === 'text' || c.type === 'paragraph') {
                                    subRuns.push.apply(subRuns, inlineRuns(c.tokens || [], { size: 20 }));
                                }
                            });
                            if (subRuns.length) {
                                paras.push(new Paragraph({
                                    children: subRuns,
                                    bullet: { level: 1 },
                                    spacing: { after: 80 }
                                }));
                            }
                        });
                    }
                });
                return paras;
            }

            const children = [];
            marked.lexer(markdown).forEach(function (tok) {
                if (tok.type === 'heading') {
                    children.push(headingParagraph(tok));
                } else if (tok.type === 'paragraph') {
                    children.push(new Paragraph({
                        children: inlineRuns(tok.tokens, { size: 20 }),
                        spacing: { after: 120 }
                    }));
                } else if (tok.type === 'list') {
                    (tok.items || []).forEach(function (item) {
                        children.push.apply(children, listItemParagraphs(item));
                    });
                } else if (tok.type === 'blockquote') {
                    children.push(new Paragraph({
                        children: inlineRuns(tok.tokens && tok.tokens[0] ? tok.tokens[0].tokens : [], { size: 20, italics: true }),
                        spacing: { after: 120 },
                        indent: { left: 360 }
                    }));
                } else if (tok.type === 'text') {
                    const runs = inlineRuns(tok.tokens || [], { size: 20 });
                    if (runs.length) children.push(new Paragraph({ children: runs, spacing: { after: 120 } }));
                }
                // 'space' and 'hr' intentionally produce nothing.
            });

            return new Document({
                creator: 'Shaik Reza Shafiq',
                title: 'Shaik Reza Shafiq — Resume',
                styles: {
                    default: { document: { run: { font: 'Calibri', size: 20, color: '000000' } } }
                },
                sections: [{
                    properties: {
                        page: { margin: { top: 720, right: 720, bottom: 720, left: 720 } }
                    },
                    children: children
                }]
            });
        }

        docxBtn.addEventListener('click', function () {
            if (!markdownSource) { setStatus('Resume has not loaded yet.', 'err'); return; }
            if (!window.docx) { setStatus('DOCX library is not available.', 'err'); return; }

            const original = docxBtn.textContent;
            docxBtn.disabled = true;
            docxBtn.textContent = 'Building DOCX…';
            setStatus('', '');

            // Yield a frame so the button state paints before the synchronous build.
            setTimeout(function () {
                try {
                    const doc = buildDocx(markdownSource);
                    window.docx.Packer.toBlob(doc).then(function (blob) {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = FILENAME;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
                        setStatus('Downloaded ' + FILENAME + ' — single column, no tables, ATS-parser friendly.', 'ok');
                    }).catch(function (e) {
                        setStatus('Could not package the DOCX: ' + e, 'err');
                    }).finally(function () {
                        docxBtn.disabled = false;
                        docxBtn.textContent = original;
                    });
                } catch (e) {
                    setStatus('Could not build the DOCX: ' + e, 'err');
                    docxBtn.disabled = false;
                    docxBtn.textContent = original;
                }
            }, 0);
        });
    })();
    </script>
</body>
</html>
