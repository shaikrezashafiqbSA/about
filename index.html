<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Render</title>
<style>
  /* Theme tokens mirror js/render.js so the preview and the .docx agree. */
  :root {
    --accent: #1F3A5F; --ink: #1A1A1A; --muted: #5A5A5A; --rule: #B8C4D4;
    --head-font: Georgia, "Times New Roman", serif;
    --body-font: Calibri, Carlito, "Segoe UI", system-ui, sans-serif;
    --ui-font: "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono-font: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --shell: #f4f5f7; --panel: #ffffff; --line: #dfe3e8;
  }
  body[data-theme="charcoal"] { --accent: #2B2B2B; --muted: #606060; --rule: #C6C6C6; }
  body[data-theme="teal"] { --accent: #14524B; --muted: #5A5A5A; --rule: #B5CCC8;
                            --head-font: var(--body-font); }
  body[data-theme="plain"] { --accent: #000000; --ink: #000000; --muted: #444444;
                             --rule: #999999; --head-font: var(--body-font); }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--shell); color: #222; overflow: hidden;
         font-family: var(--ui-font); font-size: 14px; }

  .layout { display: flex; align-items: stretch; gap: 18px;
            height: 100%; padding: 18px; }

  /* ---------------------------------------------------------- controls */
  .panel { flex: 0 0 300px; overflow-y: auto; background: var(--panel);
           border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .panel h1 { font-size: 16px; margin: 0 0 2px; letter-spacing: .01em; }
  .panel .sub { color: #667; font-size: 12px; margin: 0 0 14px; line-height: 1.4; }
  .panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
              color: #667; margin: 18px 0 8px; font-weight: 600; }
  input[type="text"], select {
    width: 100%; padding: 7px 9px; font: inherit; font-size: 13px;
    border: 1px solid var(--line); border-radius: 5px; background: #fff; color: #222; }
  input[type="text"]:focus, select:focus, textarea:focus {
    outline: 2px solid var(--accent); outline-offset: -1px; }

  .heading-row { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
  .heading-tag { flex: 0 0 68px; font-size: 9px; letter-spacing: .05em;
                 text-transform: uppercase; color: var(--accent); font-weight: 600;
                 background: #eef2f7; border-radius: 3px; padding: 4px 4px;
                 text-align: center; }
  .heading-tag.custom { color: #8a6d3b; background: #fdf6e6; }
  .heading-row input { font-size: 12px; }
  .hint { font-size: 12px; color: #778; margin: 0; line-height: 1.45; }

  .row { display: flex; gap: 8px; align-items: center; margin-top: 16px; }
  button { font: inherit; font-size: 13px; border-radius: 5px; cursor: pointer;
           border: 1px solid var(--line); background: #fff; padding: 8px 11px; }
  button:hover { border-color: #b9c0c9; }
  #download { flex: 1; background: var(--accent); color: #fff; border-color: transparent;
              font-weight: 600; }
  #download:disabled { background: #9aa3ad; cursor: not-allowed; }

  .pages { margin-top: 14px; font-size: 12px; color: #667; }
  .pages.over { color: #b02a37; font-weight: 600; }
  .status { margin-top: 10px; font-size: 12px; line-height: 1.45; padding: 0;
            border-radius: 5px; }
  .status.ok   { padding: 8px 10px; background: #eef9f1; color: #1c6b39; }
  .status.err  { padding: 8px 10px; background: #fdf0f1; color: #97202a; }
  .status.warn { padding: 8px 10px; background: #fdf7e8; color: #7d5a12; }

  /* ------------------------------------------------------------ editor */
  .col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .editor-col { flex: 1 1 380px; }
  .col-head { display: flex; align-items: baseline; justify-content: space-between;
              gap: 10px; margin-bottom: 7px; font-size: 11px; font-weight: 600;
              text-transform: uppercase; letter-spacing: .08em; color: #667; }
  .col-head .note { font-weight: 400; text-transform: none; letter-spacing: 0;
                    font-size: 11.5px; color: #8a93a0; }
  .col-head button { padding: 3px 8px; font-size: 11.5px; }

  #editor { flex: 1 1 auto; width: 100%; resize: none; padding: 14px 16px;
            border: 1px solid var(--line); border-radius: 8px; background: #fff;
            font-family: var(--mono-font); font-size: 12.5px; line-height: 1.55;
            color: #24292f; tab-size: 2; }
  #editor.over { border-color: var(--accent); background: #f7fafd; }

  /* ----------------------------------------------------------- preview */
  .stage-col { flex: 1.35 1 0; }
  .stage { flex: 1 1 auto; overflow: auto; }
  .scaler { margin: 0 auto; }
  .sheet-wrap { position: relative; width: 210mm; transform-origin: top left; }
  #rules { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .page-rule { position: absolute; left: 0; right: 0; border-top: 1px dashed #c3c9d2; }
  .page-rule::after { content: attr(data-label); position: absolute; right: 4px;
                      top: 3px; font-size: 10px; color: #a9b0ba; }

  /* A4 at the same margins the .docx uses, so the ruler means something. */
  #sheet { width: 210mm; min-height: 297mm; padding: 0.55in 0.7in;
           background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12);
           font-family: var(--body-font); font-size: 10pt; color: var(--ink);
           line-height: 1.32; }

  #sheet p { margin: 0; }
  .r-name { text-align: center; font-family: var(--head-font); font-size: 20pt;
            font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
            color: var(--accent); margin-bottom: 2pt; }
  .r-contact { text-align: center; font-size: 9pt; color: var(--muted);
               margin-bottom: 3pt; }
  .r-headline { text-align: center; font-family: var(--head-font); font-size: 10pt;
                font-weight: 700; margin-bottom: 1pt; }
  .r-subline { text-align: center; font-size: 9.5pt; font-style: italic;
               color: var(--muted); margin-bottom: 10pt; }

  .r-section { font-family: var(--head-font); font-size: 10.5pt; font-weight: 700;
               text-transform: uppercase; letter-spacing: .05em; color: var(--accent);
               border-bottom: 1px solid var(--rule); padding-bottom: 3pt;
               margin: 13pt 0 4.5pt; }
  .r-role { font-weight: 700; font-size: 10.5pt; margin-top: 10pt; }
  .r-org { display: flex; justify-content: space-between; gap: 12pt;
           font-size: 9.5pt; color: var(--muted); margin-bottom: 3.5pt; }
  .r-dates { font-style: italic; white-space: nowrap; }
  .r-edu { display: flex; justify-content: space-between; gap: 12pt;
           margin-top: 6pt; margin-bottom: 3pt; }
  .r-note { font-size: 9.5pt; color: var(--muted); margin-bottom: 3pt; }
  .r-subhead { font-weight: 700; font-style: italic; font-size: 9.5pt;
               color: var(--accent); margin: 7.5pt 0 2.5pt; }
  .r-callout { font-size: 9.5pt; font-style: italic; color: var(--accent);
               border-left: 2px solid var(--rule); padding-left: 8pt;
               margin: 4pt 0 5.5pt 11pt; }
  .r-context { font-size: 9.5pt; font-style: italic; color: var(--muted);
               margin-bottom: 3.5pt; }
  .r-skill { margin-bottom: 3.5pt; }
  .r-para { margin-bottom: 5pt; }
  .r-bullet { position: relative; padding-left: 16pt; margin-bottom: 3pt; }
  .r-bullet::before { content: "\2022"; position: absolute; left: 5pt;
                      color: var(--muted); }
  #sheet strong { color: inherit; }
  .r-skill strong, .r-bullet strong { color: var(--accent); }
  #sheet a { color: var(--accent); }

  /* Below this width the three columns stop being readable, so the page
     becomes an ordinary scrolling document instead. */
  @media (max-width: 1100px) {
    body { overflow: auto; }
    .layout { flex-direction: column; height: auto; }
    .panel { flex: none; overflow: visible; }
    .col { flex: none; }
    #editor { height: 45vh; }
    .stage { overflow: visible; }
  }
</style>
</head>
<body data-theme="navy">

<div class="layout">
  <div class="panel">
    <h1>Resume Render</h1>
    <p class="sub">Write Markdown, watch the Word document build. Nothing leaves
    your browser.</p>

    <h2>Organisation</h2>
    <input type="text" id="org" placeholder="e.g. Ministry of Digital Development"
           autocomplete="off">

    <h2>Section headings</h2>
    <div id="headings"></div>

    <h2>Theme</h2>
    <select id="theme">
      <option value="navy">Navy, serif headings</option>
      <option value="charcoal">Charcoal, serif headings</option>
      <option value="teal">Teal, sans throughout</option>
      <option value="plain">Plain black, prints in greyscale</option>
    </select>

    <div class="row">
      <button id="download" disabled>Download .docx</button>
      <button id="reset" title="Restore the default heading names">Reset</button>
    </div>

    <p class="pages" id="pages"></p>
    <p class="status" id="status"></p>
  </div>

  <div class="col editor-col">
    <div class="col-head">
      <span>Markdown</span>
      <span>
        <span class="note" id="source"></span>
        <button id="open" title="Load a .md file into the editor">Open file</button>
        <button id="sample" title="Replace the editor with the bundled sample">Sample</button>
      </span>
    </div>
    <textarea id="editor" spellcheck="false"
              placeholder="Start typing, paste a resume, or drop a .md file here."></textarea>
    <input type="file" id="file" hidden
           accept=".md,.markdown,.txt,text/markdown,text/plain">
  </div>

  <div class="col stage-col">
    <div class="col-head"><span>Preview</span><span class="note">A4, live</span></div>
    <div class="stage">
      <div class="scaler" id="scaler">
        <div class="sheet-wrap" id="wrap">
          <div id="rules"></div>
          <div id="sheet"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.js"></script>
<script src="js/parse.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
