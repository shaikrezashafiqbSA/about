<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaik Reza Shafiq | Portfolio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0;
            position: relative;
        }

        /* Two full-viewport photo layers that slowly crossfade into each other,
           with a gentle zoom (Ken Burns) so the page reads as "alive" without
           the cost/jank of a real cloth-simulation flag-wave effect. Missing
           files here just render nothing -- no broken-image icon, no error. */
        .bg-layer {
            position: fixed; inset: 0;
            background-size: cover; background-position: center;
            opacity: 0;
            animation: bgCrossfade 18s ease-in-out infinite;
            pointer-events: none;
        }
        .bg-layer-1 { background-image: url('assets/bg-1.jpg'); animation-delay: 0s; }
        .bg-layer-2 { background-image: url('assets/bg-2.jpg'); animation-delay: 9s; }
        @keyframes bgCrossfade {
            0%   { opacity: 0; transform: scale(1.02); }
            8%   { opacity: 1; transform: scale(1.04); }
            42%  { opacity: 1; transform: scale(1.08); }
            50%  { opacity: 0; transform: scale(1.1); }
            100% { opacity: 0; transform: scale(1.1); }
        }
        .bg-wash {
            position: fixed; inset: 0;
            background: rgba(244, 246, 249, 0.82);
            pointer-events: none;
        }
        @media (prefers-reduced-motion: reduce) {
            .bg-layer { animation: none; opacity: 0; }
        }

        .card {
            position: relative;
            background: white; padding: 40px; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center; max-width: 400px; width: 100%;
            margin: 24px;
        }
        h1 { color: #1e293b; margin: 0 0 8px 0; font-size: 24px; }
        p { color: #64748b; margin-bottom: 24px; }
        .btn { display: block; background: #0056b3; color: white; padding: 14px; margin: 12px 0; text-decoration: none; border-radius: 6px; font-weight: 600; }
        .btn-alt { background: #10b981; }
        .btn-ask { background: #7c3aed; }
        .btn-project { background: white; color: #1e293b; border: 2px solid #e2e8f0; }
    </style>
</head>
<body>
    <div class="bg-layer bg-layer-1"></div>
    <div class="bg-layer bg-layer-2"></div>
    <div class="bg-wash"></div>

    <div class="card">
        <h1>Shaik Reza Shafiq</h1>
        <p>Professional Hub & Resume Scanner</p>
        <a href="web/render.html" class="btn">📄 View My Styled CV</a>
        <a href="web/matcher.html" class="btn btn-alt">🤖 Open Local AI Matcher</a>
        <a href="web/ask.html" class="btn btn-ask">💬 Ask Me Anything</a>
        <a href="https://shaikrezashafiqbsa.github.io/steps-of-muhammad/" class="btn btn-project" target="_blank" rel="noopener noreferrer">🕌 Steps of Muhammad (Project) ↗</a>
    </div>
</body>
</html>
